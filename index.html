<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olá, Supervisora! 👋</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
<!-- Fontes opcionais (o site funciona na perfeição sem elas, com tipos de letra do sistema) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Nunito:wght@500;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f4e4e4;
    --card:#fbf0ec;
    --brown:#3d1f26;
    --brown-soft:#5a3a41;
    --olive:#7a9a63;
    --olive-dark:#6a8955;
    --pink:#f9c8c3;
    --pink-line:#e9b5b8;
    --pink-btn:#fbdcd9;
    --hand:'Itim','Patrick Hand','Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;
    --sans:'Nunito','Quicksand','Varela Round','Trebuchet MS',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:var(--sans);color:var(--brown);
    background:var(--bg);
    display:grid;place-items:center;
    min-height:100vh;min-height:100dvh;
    padding:16px;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- Cartão ---------- */
  .card{
    position:relative;
    width:min(560px,100%);
    min-height:min(780px,calc(100dvh - 32px));
    border-radius:28px;
    background:
      radial-gradient(ellipse at 50% 35%, #fdf6f2 0%, rgba(253,246,242,0) 70%),
      var(--card);
    box-shadow:0 18px 50px rgba(160,90,100,.18), inset 0 0 0 1px rgba(255,255,255,.6);
    overflow:hidden;
    display:grid;           /* os dois ecrãs ocupam a mesma célula */
    isolation:isolate;
  }
  /* IMPORTANTE: nenhum antepassado do botão que foge pode ter transform/filter */
  .screen{grid-area:1/1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #s1{transition:opacity .55s ease, visibility 0s linear 0s}
  #s2{opacity:0;visibility:hidden;pointer-events:none}
  .card[data-screen="2"] #s1{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease, visibility 0s linear .5s}

  .blob{position:absolute;pointer-events:none;z-index:0}
  .blob.tl{top:0;left:0;width:clamp(140px,40%,230px)}
  .blob.bl{bottom:0;left:0;width:clamp(150px,46%,270px)}
  .blob.br{bottom:0;right:0;width:clamp(120px,34%,200px)}
  .blob.tr{top:0;right:0;width:clamp(60px,18%,110px)}

  .content{position:relative;z-index:1;width:100%;padding:84px 28px 64px;display:flex;flex-direction:column;align-items:center}

  /* ---------- Ecrã 1 ---------- */
  .hand{font-family:var(--hand);font-weight:700;-webkit-text-stroke:.9px currentColor;letter-spacing:.2px}
  h1.title{font-size:clamp(34px,9vw,54px);line-height:1.1;position:relative}
  .sub{margin-top:16px;font-size:clamp(17px,4.4vw,21px);color:var(--brown-soft);font-weight:500}
  .question{margin-top:26px;font-size:clamp(27px,7vw,40px);line-height:1.18;max-width:15em;text-wrap:balance}
  .buttons{margin-top:54px;width:min(440px,100%);display:flex;flex-direction:column;gap:20px;position:relative}

  .doodle{position:absolute;pointer-events:none}
  .d-pink{stroke:#ff8aa5;stroke-width:5;stroke-linecap:round;fill:none}
  .d-green{stroke:#7a9a63;stroke-width:5;stroke-linecap:round;fill:none}
  .d-heart{stroke:#f0829a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}

  /* Botão positivo */
  .btn-yes{
    position:relative;overflow:hidden;
    width:100%;min-height:80px;padding:18px 24px;
    border:0;border-radius:999px;cursor:pointer;
    font:800 clamp(21px,5.4vw,27px)/1.1 var(--sans);color:#fff;
    background:linear-gradient(180deg,#86a56e 0%,var(--olive-dark) 100%);
    box-shadow:0 12px 24px rgba(106,137,85,.35), inset 0 2px 0 rgba(255,255,255,.28), inset 0 -3px 0 rgba(0,0,0,.06);
    transition:transform .35s cubic-bezier(.3,1.6,.5,1), box-shadow .35s ease, filter .35s ease;
    z-index:2;
  }
  .btn-yes:hover,.btn-yes.pop{
    transform:scale(1.05);
    box-shadow:0 14px 34px rgba(106,137,85,.5), 0 0 0 6px rgba(166,196,140,.35), 0 0 34px rgba(255,236,150,.6), inset 0 2px 0 rgba(255,255,255,.35);
    filter:saturate(1.1) brightness(1.04);
  }
  .btn-yes:active{transform:scale(.98)}
  .btn-yes::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-20deg);opacity:0;
  }
  .btn-yes:hover::after{animation:shine .9s ease}
  @keyframes shine{0%{left:-60%;opacity:1}100%{left:130%;opacity:1}}

  /* Botão negativo (foge) */
  .nope-slot{width:100%;position:relative;z-index:1}
  .btn-nope{
    display:block;width:100%;
    padding:16px 30px;border-radius:999px;cursor:pointer;
    font:600 clamp(16px,4.2vw,19px)/1.35 var(--sans);color:var(--brown);text-align:center;
    background:linear-gradient(180deg,#fde4e1,var(--pink-btn));
    border:2px solid var(--pink-line);
    box-shadow:0 8px 18px rgba(214,140,150,.22), inset 0 1px 0 rgba(255,255,255,.7);
    touch-action:manipulation;
  }
  .btn-nope{transition:transform .26s cubic-bezier(.2,.9,.25,1.15);will-change:transform}
  .btn-nope.returning{transition:transform .6s cubic-bezier(.45,.05,.25,1)}

  /* Entrada do ecrã 1 (só nos irmãos do botão que foge) */
  #s1 .in{animation:rise .7s cubic-bezier(.2,.9,.3,1) backwards}
  #s1 .in:nth-child(1){animation-delay:.05s}
  #s1 .in:nth-child(2){animation-delay:.18s}
  #s1 .in:nth-child(3){animation-delay:.3s}
  #s1 .in:nth-child(4){animation-delay:.42s}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* ---------- Ecrã 2 ---------- */
  .deco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .deco .p{animation:pop .6s cubic-bezier(.3,1.6,.5,1) var(--pd,0s) both, bob 3.4s ease-in-out var(--bd,0s) infinite alternate}
  @keyframes pop{from{scale:0}to{scale:1}}
  @keyframes bob{from{translate:0 -4px}to{translate:3px 6px}}

  #s2 .content{padding:56px 28px 60px}
  .env-wrap{width:min(320px,74%);margin-bottom:22px;position:relative}
  .env-wrap .env{animation:envIn 1s cubic-bezier(.2,1.25,.35,1) .1s both}
  .env-wrap svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 14px 14px rgba(224,130,145,.25))}
  .env-float{animation:float 4.2s ease-in-out 1.3s infinite}
  @keyframes envIn{from{opacity:0;transform:translateY(-90px) rotate(-10deg) scale(.55)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #letter{animation:letterUp 1.1s cubic-bezier(.2,.9,.3,1) .65s both}
  @keyframes letterUp{from{transform:translateY(60px)}to{transform:translateY(0)}}
  .rays line{stroke:#f48aa0;stroke-width:6;stroke-linecap:round;animation:ray 1.8s ease-in-out 1.2s infinite alternate;transform-box:fill-box}
  .rays line:nth-child(2){animation-delay:1.4s}
  .rays line:nth-child(3){animation-delay:1.6s}
  @keyframes ray{from{opacity:.55}to{opacity:1}}

  #s2.show .txt{animation:rise .8s cubic-bezier(.2,.9,.3,1) both}
  #s2.show .txt.t1{animation-delay:.7s}
  #s2.show .txt.t2{animation-delay:.9s}
  #s2.show .txt.t3{animation-delay:1.1s}
  #s2.show .env-wrap{animation:fade .4s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  h2.thanks{font-size:clamp(40px,11vw,60px);line-height:1.05}
  .msg{margin-top:22px;max-width:19em;font-size:clamp(18px,4.8vw,23px);line-height:1.5;color:var(--brown-soft);font-weight:500;text-wrap:balance}
  .btn-back{
    margin-top:34px;display:inline-flex;align-items:center;gap:14px;
    padding:16px 34px;border-radius:999px;cursor:pointer;
    font:600 18px/1 var(--sans);color:var(--brown);
    background:linear-gradient(180deg,#fdeeea,#fadfdb);
    border:2px solid var(--pink-line);
    box-shadow:0 8px 18px rgba(214,140,150,.25), inset 0 1px 0 rgba(255,255,255,.8);
    transition:transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .25s ease;
  }
  .btn-back:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 24px rgba(214,140,150,.32)}
  .btn-back:active{transform:scale(.97)}
  .btn-back svg{width:22px;height:22px;stroke:var(--brown);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Camada de efeitos ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
  .p{position:absolute;left:0;top:0;line-height:0;pointer-events:none;will-change:transform,opacity}
  .p svg{display:block;overflow:visible}
  .p.rocket{line-height:1}

  :focus-visible{outline:3px solid #b46a7a;outline-offset:4px}

  @media (max-width:420px){
    .content{padding:72px 20px 52px}
    .buttons{margin-top:44px}
  }
  @media (max-height:640px){
    .content{padding-top:56px;padding-bottom:40px}
    #s2 .content{padding-top:36px}
  }

  /* Reduzir animações: botões continuam a funcionar */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
    .btn-yes:hover{transform:none}
    .btn-nope,.btn-nope.returning{transition:none}
  }
</style>
</head>
<body>

<main class="card" id="card" data-screen="1">

  <!-- ===================== ECRÃ 1 ===================== -->
  <section class="screen" id="s1" aria-labelledby="t1">
    <svg class="blob tl" viewBox="0 0 240 170" aria-hidden="true"><path d="M0 0H222C214 30 186 44 150 54C104 67 78 96 62 132C50 158 26 170 0 174Z" fill="#f9c8c3"/></svg>
    <svg class="blob bl" viewBox="0 0 270 210" aria-hidden="true"><path d="M0 210V34C40 22 92 52 136 102C176 146 218 188 270 210Z" fill="#f9c8c3"/></svg>
    <svg class="blob br" viewBox="0 0 200 140" aria-hidden="true"><path d="M200 0C152 14 122 50 92 90C72 116 42 130 0 140H200Z" fill="#f9c8c3"/></svg>

    <div class="content">
      <h1 class="title hand in" id="t1">
        Olá, Supervisora! 👋
        <svg class="doodle" style="left:-36px;top:-6px" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path class="d-pink" d="M4 8l9 5M18 3l3 9M3 24l8-3"/></svg>
        <svg class="doodle" style="right:-34px;top:2px" width="34" height="40" viewBox="0 0 34 40" aria-hidden="true"><path class="d-pink" d="M30 6l-9 6M32 22l-10-1M20 34l8 2"/></svg>
      </h1>
      <p class="sub in">Tenho uma pergunta muito importante...</p>
      <p class="question hand in">Já sabes quando posso voltar à equipa de e-mails?</p>

      <div class="buttons">
        <svg class="doodle" style="left:-42px;top:-30px" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path class="d-green" d="M24 6l-8 12M6 20l12 2M4 36l14-4" transform="translate(6 0)"/></svg>
        <svg class="doodle" style="right:-42px;top:-30px" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path class="d-green" d="M14 6l8 12M38 20l-12 2M40 36l-14-4" transform="translate(-6 0)"/></svg>

        <button class="btn-yes in" id="yes" type="button">Vai já! Novembro! 🎉</button>

        <div class="nope-slot" id="nopeSlot">
          <button class="btn-nope" id="nope" type="button">Alexandra, já te disse que é rotativo e tens que esperar 😒</button>
        </div>
      </div>
    </div>

    <svg class="doodle" style="right:9%;bottom:10%" width="46" height="42" viewBox="0 0 46 42" aria-hidden="true"><path class="d-heart" d="M23 38C8 27 4 19 6 12C8 5 18 4 23 12C28 4 38 5 40 12C42 19 38 27 23 38Z" transform="rotate(8 23 22)"/></svg>
  </section>

  <!-- ===================== ECRÃ 2 ===================== -->
  <section class="screen" id="s2" aria-labelledby="t2" aria-live="polite">
    <div class="deco" id="deco" aria-hidden="true"></div>
    <svg class="blob bl" viewBox="0 0 270 210" aria-hidden="true"><path d="M0 210V80C30 60 80 80 130 130C165 165 215 195 270 210Z" fill="#f9c8c3" opacity=".8"/></svg>
    <svg class="blob br" viewBox="0 0 200 140" aria-hidden="true"><path d="M200 10C160 20 130 55 100 95C78 120 44 134 0 140H200Z" fill="#f9c8c3" opacity=".8"/></svg>
    <svg class="blob tr" viewBox="0 0 110 60" aria-hidden="true"><path d="M110 0V54C90 58 66 46 56 28C50 16 34 6 18 0Z" fill="#f6dfa3" opacity=".85"/></svg>

    <div class="content">
      <div class="env-wrap" aria-hidden="true">
        <div class="env"><div class="env-float">
          <svg viewBox="0 0 300 240">
            <g class="rays"><line x1="86" y1="-18" x2="98" y2="-4"/><line x1="150" y1="-26" x2="150" y2="-6"/><line x1="214" y1="-18" x2="202" y2="-4"/></g>
            <ellipse cx="150" cy="226" rx="112" ry="9" fill="#e8a2ad" opacity=".35"/>
            <!-- aba aberta atrás -->
            <path d="M34 104L150 20L266 104Z" fill="#f7c1c8" stroke="#f7c1c8" stroke-width="14" stroke-linejoin="round"/>
            <!-- corpo -->
            <rect x="30" y="96" width="240" height="122" rx="18" fill="#f4a9b4"/>
            <!-- carta -->
            <g id="letter">
              <rect x="72" y="38" width="156" height="140" rx="16" fill="#fdf1ed"/>
              <path d="M150 134C116 110 116 76 138 76C146 76 150 82 150 87C150 82 154 76 162 76C184 76 184 110 150 134Z" fill="#ff6f91"/>
            </g>
            <!-- bolso da frente -->
            <path d="M32 106C32 100 38 98 43 101L150 166L257 101C262 98 268 100 268 106V200C268 212 258 218 248 218H52C42 218 32 212 32 200Z" fill="#f6b3bc"/>
            <path d="M30 212C30 216 34 218 40 218H260C266 218 270 216 270 212L150 142Z" fill="#f9c6cc"/>
            <g fill="#fff" opacity=".9"><rect x="116" y="118" width="7" height="7" rx="1.5" transform="rotate(45 119 121)"/><rect x="186" y="150" width="6" height="6" rx="1.5" transform="rotate(45 189 153)"/><rect x="208" y="178" width="5" height="5" rx="1" transform="rotate(45 210 180)"/></g>
            <path d="M144 190l4 8 8 4-8 4-4 8-4-8-8-4 8-4Z" fill="#f6c453" transform="translate(-30 -22) scale(.9)"/>
          </svg>
        </div></div>
      </div>

      <h2 class="thanks hand txt t1" id="t2" tabindex="-1">Muito obrigada! 🥹❤️</h2>
      <p class="msg txt t2">Fico a aguardar o e-mail de confirmação do meu regresso à equipa de e-mails em novembro! 🎉</p>
      <button class="btn-back txt t3" id="back" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>
        Voltar ao início
      </button>
    </div>
  </section>
</main>

<div id="fx" aria-hidden="true"></div>

<script>
(() => {
  'use strict';

  const $ = s => document.querySelector(s);
  const card = $('#card'), s2 = $('#s2'), fx = $('#fx'), deco = $('#deco');
  const yes = $('#yes'), nope = $('#nope'), slot = $('#nopeSlot'), back = $('#back');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const COLORS = ['#ff7f9f', '#f6c453', '#a7bf90', '#dcbce8', '#f9b4bf', '#f4a261', '#9ccbe8'];
  const GOLD = ['#f6c453', '#f9d77e', '#f4b942'];

  /* =====================================================
     Partículas
  ===================================================== */
  const STAR = '<polygon points="12,1.5 15,9 22.5,9.5 16.7,14.6 18.6,22 12,17.9 5.4,22 7.3,14.6 1.5,9.5 9,9"';
  const SPARK = 'M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z';

  function make(type, size) {
    const el = document.createElement('span');
    el.className = 'p';
    if (type === 'star') {
      const s = size || rnd(12, 24), c = pick(GOLD);
      el.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 24 24">${STAR} fill="${c}" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
    } else if (type === 'sparkle') {
      const s = size || rnd(10, 20), c = pick(['#ffffff', '#fff3b0', '#ffc1d0', '#f6c453']);
      el.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="${SPARK}" fill="${c}"/></svg>`;
    } else if (type === 'ribbon') {
      const s = size || rnd(30, 54), c = pick(['#ff7f9f', '#f6c453', '#f9a1b3', '#a7bf90']);
      el.innerHTML = `<svg width="${s}" height="${s * 1.5}" viewBox="0 0 40 60"><path d="M8 4C38 10 -2 24 22 32C42 38 10 48 30 57" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/></svg>`;
    } else { // confete
      const w = rnd(6, 11), h = rnd(10, 19), c = pick(COLORS);
      el.style.cssText = `width:${w}px;height:${h}px;background:${c};border-radius:${Math.random() < .35 ? '50%' : '3px'};opacity:.95`;
    }
    return el;
  }

  function randomPiece() {
    const t = Math.random();
    return make(t < .55 ? 'confetti' : t < .72 ? 'star' : t < .85 ? 'ribbon' : 'sparkle');
  }

  /* Voo livre com ligeira gravidade */
  function fly(el, x, y, dx, dy, o = {}) {
    const { dur = 1000, g = 110, rot = 400, scale = 1 } = o;
    fx.appendChild(el);
    const r = (Math.random() - .5) * rot * 2;
    const a = el.animate([
      { transform: `translate(${x}px,${y}px) rotate(0deg) scale(.2)`, opacity: 0 },
      { transform: `translate(${x + dx * .45}px,${y + dy * .45}px) rotate(${r * .45}deg) scale(${scale})`, opacity: 1, offset: .22 },
      { transform: `translate(${x + dx}px,${y + dy + g}px) rotate(${r}deg) scale(${scale * .55})`, opacity: 0 }
    ], { duration: dur, easing: 'cubic-bezier(.15,.7,.35,1)', fill: 'forwards' });
    a.onfinish = () => el.remove();
  }

  /* Foguete festivo com rasto de brilhos */
  function rocket(x, y, ang, dist) {
    const el = document.createElement('span');
    el.className = 'p rocket';
    el.textContent = '🚀';
    el.style.fontSize = rnd(20, 28) + 'px';
    fx.appendChild(el);
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = ang * 180 / Math.PI + 45;
    const a = el.animate([
      { transform: `translate(${x}px,${y}px) rotate(${rot}deg) scale(.4)`, opacity: 0 },
      { transform: `translate(${x + dx * .15}px,${y + dy * .15}px) rotate(${rot}deg) scale(1)`, opacity: 1, offset: .15 },
      { transform: `translate(${x + dx}px,${y + dy}px) rotate(${rot}deg) scale(.9)`, opacity: 0 }
    ], { duration: 950, easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'forwards' });
    a.onfinish = () => el.remove();
    for (let i = 1; i <= 6; i++) {
      setTimeout(() => {
        const t = Math.pow(i / 7, 1.3);
        fly(make(Math.random() < .5 ? 'sparkle' : 'star', rnd(7, 12)),
          x + dx * t, y + dy * t, rnd(-18, 18), rnd(-6, 20), { dur: 600, g: 30, rot: 120 });
      }, i * 95);
    }
  }

  /* Rajada à volta de um retângulo */
  function burstAround(rect, count, power, rockets) {
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    for (let i = 0; i < count; i++) {
      const th = rnd(0, Math.PI * 2);
      const px = cx + Math.cos(th) * rect.width / 2 * rnd(.6, 1.05);
      const py = cy + Math.sin(th) * rect.height / 2 * rnd(.6, 1.15);
      const d = rnd(40, 100) * power;
      const type = pick(['star', 'star', 'sparkle', 'sparkle', 'confetti', 'confetti', 'confetti', 'ribbon']);
      fly(make(type), px, py, Math.cos(th) * d, Math.sin(th) * d - 24, { dur: rnd(800, 1300) });
    }
    for (let i = 0; i < rockets; i++) {
      const ang = -Math.PI / 2 + rnd(-1.0, 1.0);
      rocket(cx + rnd(-rect.width / 3, rect.width / 3), rect.top + 6, ang, rnd(110, 190) * power);
    }
  }

  /* Chuva de confetis */
  function fall(el, delay) {
    fx.appendChild(el);
    const vw = innerWidth, vh = innerHeight;
    const x = rnd(0, vw), sway = rnd(-90, 90), rot = rnd(-720, 720);
    const a = el.animate([
      { transform: `translate(${x}px,-50px) rotate(0deg) rotateY(0deg)` },
      { transform: `translate(${x + sway}px,${vh * .5}px) rotate(${rot * .5}deg) rotateY(${rot}deg)`, offset: .5 },
      { transform: `translate(${x - sway * .4}px,${vh + 60}px) rotate(${rot}deg) rotateY(${rot * 2}deg)` }
    ], { duration: rnd(3200, 6200), delay, easing: 'linear', fill: 'both' });
    a.onfinish = () => el.remove();
  }

  let rainTimer = null;
  function startRain() {
    if (reduced.matches) return;
    for (let i = 0; i < 80; i++) fall(randomPiece(), rnd(0, 1600));
    let n = 0;
    rainTimer = setInterval(() => {
      for (let k = 0; k < 3; k++) fall(randomPiece(), 0);
      if (++n > 24) { clearInterval(rainTimer); rainTimer = null; }
    }, 200);
  }

  /* Decoração fixa do ecrã 2 (flutua suavemente) */
  function buildDeco() {
    deco.replaceChildren();
    const n = innerWidth < 500 ? 34 : 46;
    for (let i = 0; i < n;) {
      const x = rnd(0, 98), y = rnd(0, 98);
      if (x > 8 && x < 92 && y > 52 && y < 78) continue; // não tapar o texto
      i++;
      const t = Math.random();
      const type = t < .58 ? 'confetti' : t < .78 ? 'star' : t < .9 ? 'ribbon' : 'sparkle';
      const el = make(type, type === 'ribbon' ? rnd(34, 58) : undefined);
      el.style.left = x + '%';
      el.style.top = y + '%';
      el.style.rotate = rnd(-90, 90) + 'deg';
      el.style.setProperty('--pd', rnd(.2, 1.6).toFixed(2) + 's');
      el.style.setProperty('--bd', (-rnd(0, 3)).toFixed(2) + 's');
      deco.appendChild(el);
    }
  }

  /* =====================================================
     Botão positivo — hover
  ===================================================== */
  let lastHover = 0;
  yes.addEventListener('pointerenter', () => {
    if (reduced.matches || card.dataset.screen !== '1') return;
    const now = performance.now();
    if (now - lastHover < 300) return;
    lastHover = now;
    burstAround(yes.getBoundingClientRect(), 28, 1, 3);
  });

  /* =====================================================
     Botão negativo — foge e regressa à posição original.
     A posição original é sempre o espaço reservado no layout
     (o slot): o botão só aplica um deslocamento translate()
     relativo a ela, por isso translate(0,0) = lugar original.
  ===================================================== */
  let off = { x: 0, y: 0 };          // deslocamento atual face à posição original
  let lastMove = 0, lastPtr = null, returnTimer = null, away = false;

  function applyOffset(x, y, returning) {
    off = { x, y };
    nope.classList.toggle('returning', !!returning);
    nope.style.transform = (x || y) ? `translate(${x}px,${y}px)` : '';
  }

  // Limites: a área do cartão, dentro do ecrã visível
  function bounds() {
    const c = card.getBoundingClientRect();
    const vw = document.documentElement.clientWidth, vh = innerHeight;
    return {
      l: Math.max(c.left + 12, 8), r: Math.min(c.right - 12, vw - 8),
      t: Math.max(c.top + 12, 8),  b: Math.min(c.bottom - 12, vh - 8)
    };
  }

  const hit = (a, b, pad) => a.l < b.r + pad && a.r > b.l - pad && a.t < b.b + pad && a.b > b.t - pad;

  function scheduleReturn() {
    clearTimeout(returnTimer);
    returnTimer = setTimeout(goHome, rnd(1000, 1500));
  }

  function pointerNearHome() {
    if (!lastPtr) return false;
    const h = slot.getBoundingClientRect();
    const dx = Math.max(h.left - lastPtr.x, 0, lastPtr.x - h.right);
    const dy = Math.max(h.top - lastPtr.y, 0, lastPtr.y - h.bottom);
    return Math.hypot(dx, dy) < 110;
  }

  function goHome() {
    returnTimer = null;
    if (card.dataset.screen !== '1' || !away) return;
    // Se o cursor ainda está junto ao lugar original, espera (evita vaivém constante)
    if (pointerNearHome()) { returnTimer = setTimeout(goHome, 450); return; }
    applyOffset(0, 0, true);
    away = false;
  }

  function flee(px, py, force) {
    const now = performance.now();
    if (!force && now - lastMove < 180) return;
    lastMove = now;

    const h = slot.getBoundingClientRect();            // posição original (referência)
    const w = h.width, ht = h.height;
    const bd = bounds();
    const yr = yes.getBoundingClientRect();
    const ban = { l: yr.left, r: yr.right, t: yr.top, b: yr.bottom };
    let best = null, bestScore = -Infinity;

    for (let i = 0; i < 90; i++) {
      const maxD = i < 30 ? 190 : i < 60 ? 300 : 460;   // começa perto e só alarga se for preciso
      const ang = rnd(0, Math.PI * 2), dist = rnd(70, maxD);
      const x = Math.cos(ang) * dist, y = Math.sin(ang) * dist;
      const r = { l: h.left + x, r: h.left + x + w, t: h.top + y, b: h.top + y + ht };
      if (r.l < bd.l || r.r > bd.r || r.t < bd.t || r.b > bd.b) continue;  // dentro da área do site
      if (hit(r, ban, 18)) continue;                                        // nunca sobre o botão positivo
      const dx = Math.max(r.l - px, 0, px - r.r), dy = Math.max(r.t - py, 0, py - r.b);
      const d = Math.hypot(dx, dy);
      const moved = Math.hypot(x - off.x, y - off.y);
      const score = Math.min(d, 260) + Math.min(moved, 160) * .6 - dist * .25 + rnd(0, 50);
      if (score > bestScore) { bestScore = score; best = { x, y }; }
    }

    if (best) { applyOffset(best.x, best.y, false); away = true; }
    if (away) scheduleReturn();                         // reinicia sempre o tempo de regresso
  }

  document.addEventListener('pointermove', e => {
    if (card.dataset.screen !== '1') return;
    const prev = lastPtr;
    lastPtr = { x: e.clientX, y: e.clientY, t: e.timeStamp };
    const speed = prev ? Math.hypot(e.clientX - prev.x, e.clientY - prev.y) / Math.max(1, e.timeStamp - prev.t) : 0;
    const radius = 85 + Math.min(speed * 70, 130);       // rato rápido → foge mais cedo
    const r = nope.getBoundingClientRect();               // posição atual (mesmo a meio da transição)
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < radius) flee(e.clientX, e.clientY, false);
  }, { passive: true });

  // O cursor saiu da janela / o dedo foi levantado: já não está a "perseguir" o botão
  const forget = e => { if (!e || !e.pointerType || e.pointerType !== 'mouse') lastPtr = null; };
  document.addEventListener('pointerup', forget);
  document.addEventListener('pointercancel', forget);
  document.documentElement.addEventListener('mouseleave', () => { lastPtr = null; });

  // Toque / clique direto: muda de sítio em vez de aceitar o clique
  const dodge = e => {
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    flee(p.clientX ?? 0, p.clientY ?? 0, true);
  };
  nope.addEventListener('pointerdown', dodge);
  nope.addEventListener('touchstart', dodge, { passive: false });
  nope.addEventListener('click', e => {
    e.preventDefault();
    const r = nope.getBoundingClientRect();
    flee(r.left + r.width / 2, r.top + r.height / 2, true);
  });

  // Ao redimensionar, volta já ao lugar original (evita posições inválidas)
  addEventListener('resize', () => {
    clearTimeout(returnTimer); returnTimer = null;
    away = false;
    applyOffset(0, 0, false);
  });

  function resetNope() {
    clearTimeout(returnTimer); returnTimer = null;
    away = false; lastPtr = null; off = { x: 0, y: 0 };
    nope.style.transition = 'none';
    nope.classList.remove('returning');
    nope.style.transform = '';
    void nope.offsetWidth;
    nope.style.transition = '';
  }

  /* =====================================================
     Navegação entre ecrãs
  ===================================================== */
  yes.addEventListener('click', () => {
    const r = yes.getBoundingClientRect();
    if (!reduced.matches) burstAround(r, 70, 2.1, 5);
    card.dataset.screen = '2';
    s2.classList.add('show');
    s2.style.pointerEvents = 'auto';
    s2.style.visibility = 'visible';
    s2.style.opacity = '1';
    s2.style.transition = reduced.matches ? 'none' : 'opacity .6s ease .25s';
    buildDeco();
    scrollTo(0, 0);
    setTimeout(startRain, 250);
    setTimeout(() => $('#t2').focus({ preventScroll: true }), 700);
  });

  back.addEventListener('click', () => {
    clearInterval(rainTimer); rainTimer = null;
    fx.replaceChildren();
    s2.classList.remove('show');
    s2.removeAttribute('style');
    deco.replaceChildren();
    resetNope();
    card.dataset.screen = '1';
    scrollTo(0, 0);
    yes.focus({ preventScroll: true });
  });
})();
</script>
</body>
</html>
